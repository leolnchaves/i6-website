<!doctype html>
<html><head><meta charset="utf-8"><style>
  svg { font-family: var(--font-sans); }
  .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
  .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
  .tag { font-size: 12px; fill: hsl(var(--muted-foreground)); }
</style></head>
<body>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <text x="0" y="14" class="tag">hoje</text>
  <rect x="0" y="26" width="280" height="86" rx="8" fill="hsl(var(--foreground))" opacity="0.86"/>
  <text x="16" y="60" class="lbl" fill="hsl(var(--background))">faixa escura grande</text>
  <text x="16" y="80" class="note" fill="hsl(var(--background))">título + botões</text>
  <rect x="0" y="116" width="280" height="20" rx="4" fill="hsl(var(--muted))"/>
  <text x="16" y="130" class="note">degradê de transição</text>
  <rect x="0" y="142" width="280" height="70" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="16" y="170" class="lbl">formulário</text>
  <text x="16" y="190" class="note">cartão branco sobre areia</text>

  <line x1="300" y1="40" x2="330" y2="40" stroke="hsl(var(--muted-foreground))" stroke-width="1" marker-end="url(#chev)"/>
  <defs><marker id="chev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1 L8 5 L1 9" fill="none" stroke="hsl(var(--muted-foreground))"/></marker></defs>

  <text x="360" y="14" class="tag">proposta</text>
  <rect x="360" y="26" width="280" height="186" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--primary))" stroke-opacity="0.35"/>
  <text x="376" y="56" class="lbl" fill="hsl(var(--accent-foreground))">uma seção de contato, fundo areia</text>
  <text x="376" y="78" class="note">título + botão terracota + links</text>
  <rect x="376" y="94" width="248" height="100" rx="8" fill="hsl(var(--card))" stroke="hsl(var(--border))"/>
  <text x="392" y="122" class="lbl">formulário</text>
  <text x="392" y="142" class="note">cartão branco, campos bege</text>

  <circle cx="12" cy="248" r="9" fill="hsl(var(--primary))"/>
  <text x="12" y="252" text-anchor="middle" font-size="11" fill="hsl(var(--primary-foreground))">1</text>
  <text x="30" y="252" class="note">a faixa escura e o degradê deixam de existir nessas duas páginas</text>
  <text x="30" y="274" class="note">/contact continua exatamente como está</text>
</svg>
</body></html>
