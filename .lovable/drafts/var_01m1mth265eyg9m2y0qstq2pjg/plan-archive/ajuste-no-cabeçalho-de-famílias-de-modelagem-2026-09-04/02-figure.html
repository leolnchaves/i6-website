<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans);">
  <style>
    text { font-family: var(--font-sans); }
    .box { fill: none; stroke: hsl(var(--border)); stroke-width: 1; rx: 8; }
    .label { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 600; }
    .muted { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .strike { text-decoration: line-through; fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .accent { fill: hsl(var(--primary)); font-size: 11px; font-weight: 600; letter-spacing: 0.2em; }
  </style>

  <!-- Antes -->
  <rect x="20" y="20" width="290" height="200" class="box"/>
  <text x="40" y="50" class="label">Antes</text>
  <text x="40" y="85" class="accent">OS MODELOS</text>
  <text x="40" y="110" class="label">Três famílias de capacidade de...</text>
  <text x="40" y="140" class="strike">Capacidades técnicas disponíveis na plataforma, combináveis...</text>
  <text x="40" y="170" class="muted">max-w-3xl + truncate</text>

  <!-- Depois -->
  <rect x="330" y="20" width="290" height="200" class="box"/>
  <text x="350" y="50" class="label">Depois</text>
  <text x="350" y="85" class="accent">OS MODELOS</text>
  <text x="350" y="110" class="label">Três famílias de capacidade de modelagem</text>
  <text x="350" y="140" class="muted">Capacidades técnicas disponíveis na plataforma, combináveis conforme o produto que você constrói</text>
  <text x="350" y="170" class="muted">largura total + fonte ajustada + sem truncate</text>
</svg>
