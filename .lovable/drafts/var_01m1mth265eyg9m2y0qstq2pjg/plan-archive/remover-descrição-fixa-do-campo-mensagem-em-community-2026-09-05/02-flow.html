<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans);">
  <style>
    text { font-family: inherit; }
    .label { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box-label { font-size: 13px; fill: hsl(var(--foreground)); }
    .accent-label { font-size: 13px; fill: hsl(var(--accent-foreground)); font-weight: 600; }
    .box { stroke: hsl(var(--border)); fill: hsl(var(--card)); rx: 8; }
    .accent { stroke: hsl(var(--accent)); fill: hsl(var(--accent)); rx: 8; }
    .muted { stroke: hsl(var(--muted)); fill: hsl(var(--muted)); rx: 8; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
  </style>

  <!-- default -->
  <rect x="40" y="40" width="170" height="220" class="box" />
  <text x="125" y="68" text-anchor="middle" class="box-label">/contact (default)</text>
  <rect x="60" y="90" width="130" height="24" class="muted" />
  <text x="125" y="106" text-anchor="middle" class="label">Label: Mensagem</text>
  <rect x="60" y="124" width="130" height="40" class="accent" />
  <text x="125" y="142" text-anchor="middle" class="accent-label">Descrição fixa</text>
  <text x="125" y="158" text-anchor="middle" class="accent-label">mantida</text>
  <rect x="60" y="178" width="130" height="56" class="muted" />
  <text x="125" y="200" text-anchor="middle" class="label">Textarea</text>
  <text x="125" y="216" text-anchor="middle" class="label">placeholder curto</text>

  <!-- builders -->
  <rect x="235" y="40" width="170" height="220" class="box" />
  <text x="320" y="68" text-anchor="middle" class="box-label">/i6-builders</text>
  <rect x="255" y="90" width="130" height="24" class="muted" />
  <text x="320" y="106" text-anchor="middle" class="label">Label: Mensagem</text>
  <rect x="255" y="124" width="130" height="40" class="accent" />
  <text x="320" y="142" text-anchor="middle" class="accent-label">Descrição fixa</text>
  <text x="320" y="158" text-anchor="middle" class="accent-label">mantida</text>
  <rect x="255" y="178" width="130" height="56" class="muted" />
  <text x="320" y="200" text-anchor="middle" class="label">Textarea</label>
  <text x="320" y="216" text-anchor="middle" class="label">placeholder curto</text>

  <!-- community -->
  <rect x="430" y="40" width="170" height="220" class="box" />
  <text x="515" y="68" text-anchor="middle" class="box-label">/community</text>
  <rect x="450" y="90" width="130" height="24" class="muted" />
  <text x="515" y="106" text-anchor="middle" class="label">Label: Mensagem</text>
  <rect x="450" y="124" width="130" height="40" class="muted" stroke-dasharray="4 3" />
  <text x="515" y="148" text-anchor="middle" class="label" style="font-style: italic;">sem descrição</text>
  <rect x="450" y="178" width="130" height="56" class="muted" />
  <text x="515" y="200" text-anchor="middle" class="label">Textarea</text>
  <text x="515" y="216" text-anchor="middle" class="label">placeholder curto</text>

  <!-- arrows -->
  <line x1="210" y1="150" x2="235" y2="150" class="wire" marker-end="url(#arrow)" />
  <line x1="405" y1="150" x2="430" y2="150" class="wire" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))" />
    </marker>
  </defs>
</svg>
