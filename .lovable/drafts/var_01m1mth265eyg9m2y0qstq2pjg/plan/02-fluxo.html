<div style="font-family: var(--font-sans)">
<svg viewBox="0 0 640 250" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lbl { font-family: var(--font-sans); font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-family: var(--font-sans); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .accentbox { fill: hsl(var(--accent)); stroke: hsl(var(--accent-foreground)); stroke-width: 1; }
    .acctxt { font-family: var(--font-sans); font-size: 14px; font-weight: 480; fill: hsl(var(--accent-foreground)); }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .halo { paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 4px; }
  </style>
  <defs>
    <marker id="ch" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="box" x="8" y="40" width="120" height="56" rx="8"/>

  <text class="note" x="68" y="88" text-anchor="middle">dados + campos novos</text>

  <rect class="accentbox" x="176" y="40" width="150" height="56" rx="8"/>
  <text class="acctxt" x="251" y="66" text-anchor="middle">conversor</text>
  <text class="note" x="251" y="84" text-anchor="middle" fill="hsl(var(--accent-foreground))">grava o cabeçalho</text>

  <rect class="box" x="374" y="40" width="120" height="56" rx="8"/>
  <text class="lbl" x="434" y="72" text-anchor="middle">arquivos</text>

  <rect class="box" x="530" y="16" width="102" height="34" rx="8"/>
  <text class="lbl" x="581" y="38" text-anchor="middle">pesquisa</text>
  <rect class="box" x="530" y="58" width="102" height="34" rx="8"/>
  <text class="lbl" x="581" y="80" text-anchor="middle">blog</text>
  <rect class="box" x="530" y="100" width="102" height="34" rx="8"/>
  <text class="lbl" x="581" y="122" text-anchor="middle">mídia</text>

  <line class="wire" x1="130" y1="68" x2="172" y2="68" marker-end="url(#ch)"/>
  <line class="wire" x1="328" y1="68" x2="370" y2="68" marker-end="url(#ch)"/>
  <line class="wire" x1="496" y1="68" x2="526" y2="33" marker-end="url(#ch)"/>
  <line class="wire" x1="496" y1="68" x2="526" y2="75" marker-end="url(#ch)"/>
  <line class="wire" x1="496" y1="68" x2="526" y2="117" marker-end="url(#ch)"/>

  <circle cx="251" cy="130" r="10" fill="hsl(var(--accent))"/>
  <text x="251" y="134" text-anchor="middle" style="font-size:12px; fill:hsl(var(--accent-foreground)); font-family:var(--font-sans)">1</text>
  <text class="note halo" x="272" y="134">todo campo fora da lista é descartado em silêncio</text>

  <circle cx="251" cy="164" r="10" fill="hsl(var(--accent))"/>
  <text x="251" y="168" text-anchor="middle" style="font-size:12px; fill:hsl(var(--accent-foreground)); font-family:var(--font-sans)">2</text>
  <text class="note halo" x="272" y="168">o tipo "i6 Blog" é filtrado antes de gravar — nunca chega ao site</text>

  <text class="note" x="8" y="216">Etapa 1 conserta este ponto: nada nas páginas funciona antes dos campos existirem no arquivo.</text>
</svg>
</div>
