<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  svg { font-family: var(--font-sans); }
  .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
  .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
  .tag { font-size: 12px; fill: hsl(var(--muted-foreground)); }
  .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
  .dark { fill: hsl(var(--muted)); stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
  .rail { stroke: hsl(var(--border)); stroke-width: 1; }
  .greek { fill: hsl(var(--border)); }
  .acc { fill: hsl(var(--accent)); }
  .accink { font-size: 12px; font-weight: 480; fill: hsl(var(--accent-foreground)); }
</style></head>
<body>
<svg viewBox="0 0 640 470" width="640" xmlns="http://www.w3.org/2000/svg">
  <!-- left column: hoje -->
  <text class="tag" x="8" y="14">hoje — mesmo bloco oito vezes</text>
  <g>
    <rect class="box" x="8" y="26" width="180" height="46" rx="8"/>
    <rect class="greek" x="20" y="38" width="70" height="6" rx="3"/>
    <rect class="greek" x="20" y="52" width="60" height="8" rx="4"/>
    <rect class="greek" x="96" y="52" width="26" height="8" rx="4"/>
    <rect class="greek" x="128" y="52" width="26" height="8" rx="4"/>
  </g>
  <g>
    <rect class="box" x="8" y="82" width="180" height="46" rx="8"/>
    <rect class="greek" x="20" y="94" width="70" height="6" rx="3"/>
    <rect class="greek" x="20" y="108" width="60" height="8" rx="4"/>
    <rect class="greek" x="96" y="108" width="26" height="8" rx="4"/>
    <rect class="greek" x="128" y="108" width="26" height="8" rx="4"/>
  </g>
  <g>
    <rect class="box" x="8" y="138" width="180" height="46" rx="8"/>
    <rect class="greek" x="20" y="150" width="70" height="6" rx="3"/>
    <rect class="greek" x="20" y="164" width="60" height="8" rx="4"/>
    <rect class="greek" x="96" y="164" width="26" height="8" rx="4"/>
    <rect class="greek" x="128" y="164" width="26" height="8" rx="4"/>
  </g>
  <text class="note" x="8" y="206">…e assim por diante</text>

  <!-- divider -->
  <line class="rail" x1="212" y1="20" x2="212" y2="450"/>

  <!-- right column: proposto -->
  <text class="tag" x="240" y="14">proposto — cada seção com forma própria</text>

  <!-- 1 abertura -->
  <rect class="box" x="240" y="26" width="200" height="56" rx="8"/>
  <rect class="greek" x="252" y="40" width="90" height="10" rx="5"/>
  <rect class="greek" x="252" y="58" width="66" height="6" rx="3"/>
  <rect class="dark" x="448" y="26" width="184" height="56" rx="8"/>
  <text class="accink" x="460" y="48" style="fill: hsl(var(--muted-foreground))">forecast(sku, loja)</text>
  <text class="note" x="460" y="66">→ ruptura em 6 dias</text>
  <text class="note" x="240" y="96">1 · abertura com código ao vivo</text>

  <!-- 2 o que é: linha contínua -->
  <line class="rail" x1="240" y1="118" x2="632" y2="118"/>
  <rect class="greek" x="248" y="128" width="88" height="6" rx="3"/>
  <line class="rail" x1="368" y1="122" x2="368" y2="142"/>
  <rect class="greek" x="380" y="128" width="88" height="6" rx="3"/>
  <line class="rail" x1="500" y1="122" x2="500" y2="142"/>
  <rect class="greek" x="512" y="128" width="88" height="6" rx="3"/>
  <line class="rail" x1="240" y1="152" x2="632" y2="152"/>
  <text class="note" x="240" y="168">2 · três frases em linha, sem cards</text>

  <!-- 3 faixa escura percurso -->
  <rect class="dark" x="240" y="182" width="392" height="52" rx="8"/>
  <line class="rail" x1="272" y1="208" x2="600" y2="208"/>
  <circle class="acc" cx="288" cy="208" r="7"/>
  <circle cx="424" cy="208" r="6" fill="hsl(var(--background))" stroke="hsl(var(--muted-foreground))"/>
  <circle cx="576" cy="208" r="6" fill="hsl(var(--background))" stroke="hsl(var(--muted-foreground))"/>
  <text class="note" x="272" y="230">SDK</text>
  <text class="note" x="410" y="230">API</text>
  <text class="note" x="556" y="230">Toolkit</text>
  <text class="note" x="240" y="250">3 · percurso em faixa escura</text>

  <!-- 4 modelos editorial -->
  <text class="lbl" x="240" y="284" style="font-size:20px">01</text>
  <rect class="greek" x="240" y="292" width="80" height="6" rx="3"/>
  <text class="lbl" x="376" y="284" style="font-size:20px">02</text>
  <rect class="greek" x="376" y="292" width="80" height="6" rx="3"/>
  <text class="lbl" x="512" y="284" style="font-size:20px">03</text>
  <rect class="greek" x="512" y="292" width="80" height="6" rx="3"/>
  <text class="note" x="240" y="312">4 · motores em colunas editoriais</text>

  <!-- 5 carrossel -->
  <rect class="box" x="240" y="326" width="96" height="34" rx="8"/>
  <rect class="box" x="344" y="326" width="96" height="34" rx="8"/>
  <rect class="box" x="448" y="326" width="96" height="34" rx="8"/>
  <rect class="box" x="552" y="326" width="80" height="34" rx="8" stroke-dasharray="4 3"/>
  <text class="note" x="240" y="376">5 · aceleradores deslizam na horizontal</text>

  <!-- 6 dois caminhos -->
  <rect class="box" x="240" y="390" width="192" height="40" rx="8"/>
  <rect class="dark" x="440" y="390" width="192" height="40" rx="8"/>
  <rect class="greek" x="256" y="406" width="80" height="6" rx="3"/>
  <rect class="greek" x="456" y="406" width="80" height="6" rx="3"/>
  <text class="note" x="240" y="446">6 · dois caminhos contrastantes · 7 citações · 8 fecho escuro</text>
</svg>
</body>
</html>
