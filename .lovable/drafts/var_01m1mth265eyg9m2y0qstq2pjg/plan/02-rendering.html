<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans);">
  <!-- Per-line stack -->
  <text x="20" y="30" font-size="14" font-weight="480" fill="hsl(var(--foreground))">Cada linha = duas camadas sobrepostas</text>

  <rect x="20" y="48" rx="8" width="420" height="72" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <text x="36" y="76" font-size="12" font-family="var(--font-mono)" fill="hsl(var(--muted-foreground))" opacity="0.45">builder = Builder(api_key=I6_KEY)</text>
  <text x="36" y="98" font-size="11" fill="hsl(var(--muted-foreground))">fantasma: texto completo invisível — reserva a largura final</text>

  <text x="36" y="76" font-size="12" font-family="var(--font-mono)" fill="hsl(var(--foreground))">builder = Bui</text>
  <rect x="112" y="66" width="2" height="14" fill="hsl(var(--primary))"/>

  <line x1="470" y1="66" x2="470" y2="106" stroke="hsl(var(--muted-foreground))" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="482" y="80" font-size="12" fill="hsl(var(--muted-foreground))">camada digitada por cima,</text>
  <text x="482" y="96" font-size="12" fill="hsl(var(--muted-foreground))">cursor após o último char</text>

  <!-- Timing lane -->
  <text x="20" y="162" font-size="14" font-weight="480" fill="hsl(var(--foreground))">Cadência</text>

  <line x1="20" y1="196" x2="620" y2="196" stroke="hsl(var(--border))" stroke-width="1"/>

  <!-- char ticks -->
  <g stroke="hsl(var(--muted-foreground))" stroke-width="1">
    <line x1="40" y1="188" x2="40" y2="204"/>
    <line x1="78" y1="188" x2="78" y2="204"/>
    <line x1="109" y1="188" x2="109" y2="204"/>
    <line x1="152" y1="188" x2="152" y2="204"/>
    <line x1="186" y1="188" x2="186" y2="204"/>
    <line x1="228" y1="188" x2="228" y2="204"/>
  </g>
  <text x="36" y="222" font-size="11" fill="hsl(var(--muted-foreground))">c</text>
  <text x="74" y="222" font-size="11" fill="hsl(var(--muted-foreground))">h</text>
  <text x="105" y="222" font-size="11" fill="hsl(var(--muted-foreground))">a</text>
  <text x="148" y="222" font-size="11" fill="hsl(var(--muted-foreground))">r</text>
  <text x="182" y="222" font-size="11" fill="hsl(var(--muted-foreground))">s</text>
  <text x="224" y="222" font-size="11" fill="hsl(var(--muted-foreground))">…</text>
  <text x="40" y="244" font-size="12" fill="hsl(var(--muted-foreground))">40ms ± 15ms aleatório por caractere</text>

  <!-- newline pause -->
  <line x1="228" y1="196" x2="430" y2="196" stroke="hsl(var(--primary))" stroke-width="2"/>
  <text x="430" y="222" font-size="11" fill="hsl(var(--primary))" text-anchor="end">↵</text>
  <line x1="440" y1="188" x2="440" y2="204" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <text x="300" y="244" font-size="12" fill="hsl(var(--muted-foreground))">+350ms ao quebrar linha</text>

  <!-- done state -->
  <rect x="520" y="180" width="2" height="14" fill="hsl(var(--primary))"/>
  <text x="532" y="191" font-size="12" fill="hsl(var(--muted-foreground))">fim: cursor pisca, sem loop</text>
</svg>
