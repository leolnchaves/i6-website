<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); color: hsl(var(--foreground));">
  <style>
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .fill { fill: hsl(var(--muted)); stroke: none; }
    .accent { fill: hsl(var(--primary)); }
    .text { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 600; }
    .small { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .wire { stroke: hsl(var(--primary)); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="accent" />
    </marker>
  </defs>

  <rect x="40" y="40" width="260" height="80" class="box" />
  <text x="60" y="70" class="text">Antes</text>
  <text x="60" y="95" class="small">/:lang/comunidade</text>
  <text x="60" y="110" class="small">/comunidade</text>

  <rect x="340" y="40" width="260" height="80" class="box" />
  <rect x="340" y="40" width="260" height="80" style="fill: hsl(var(--primary) / 0.08); stroke: hsl(var(--primary)); stroke-width: 2; rx: 8;" />
  <text x="360" y="70" class="text">Depois</text>
  <text x="360" y="95" class="small accent-text" style="fill: hsl(var(--primary)); font-weight: 700;">/:lang/community</text>
  <text x="360" y="110" class="small accent-text" style="fill: hsl(var(--primary)); font-weight: 700;">/community</text>

  <line x1="300" y1="80" x2="340" y2="80" class="wire" />

  <text x="40" y="170" class="text">Pontos de entrada atualizados</text>
  <text x="40" y="195" class="small">Header, footer, CTAs do i6-builders, sitemap e redirecionamento da rota antiga.</text>
</svg>
