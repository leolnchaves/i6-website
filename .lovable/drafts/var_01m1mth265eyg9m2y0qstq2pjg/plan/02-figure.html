<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .surface { fill: hsl(var(--muted)); stroke: none; }
    .lbl { fill: hsl(var(--foreground)); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .note { fill: hsl(var(--muted-foreground)); font-family: var(--font-sans); font-size: 12px; }
    .acc { stroke: hsl(var(--primary)); stroke-width: 2; fill: none; }
    .accf { fill: hsl(var(--primary)); }
  </style>

  <text x="30" y="28" class="lbl">Antes — foto repetida do bloco 01</text>
  <rect x="30" y="44" width="240" height="120" rx="18" class="surface" />
  <rect x="30" y="44" width="240" height="120" rx="18" class="box" />
  <circle cx="80" cy="130" r="12" fill="hsl(var(--border))" />
  <circle cx="120" cy="134" r="12" fill="hsl(var(--border))" />
  <circle cx="160" cy="130" r="12" fill="hsl(var(--border))" />
  <text x="30" y="186" class="note">enquadramento centralizado corta as cabeças</text>

  <text x="360" y="28" class="lbl">Depois — foto do time, rostos no topo</text>
  <rect x="360" y="44" width="240" height="120" rx="18" class="surface" />
  <rect x="360" y="44" width="240" height="120" rx="18" class="acc" />
  <circle cx="410" cy="78" r="12" class="accf" />
  <circle cx="450" cy="82" r="12" fill="hsl(var(--muted-foreground))" />
  <circle cx="490" cy="78" r="12" fill="hsl(var(--muted-foreground))" />
  <circle cx="530" cy="82" r="12" fill="hsl(var(--muted-foreground))" />
  <text x="360" y="186" class="note">recorte deslocado para cima: rostos inteiros e visíveis</text>

  <line x1="290" y1="104" x2="345" y2="104" class="acc" />
  <path d="M345,99 L355,104 L345,109 Z" class="accf" />

  <text x="30" y="234" class="lbl">Mantido sem alteração</text>
  <text x="30" y="256" class="note">tamanho, cantos arredondados, inclinação, opacidade, borda e posição no mural</text>
  <text x="30" y="276" class="note">as demais fotos do mural continuam como estão</text>
</svg>
