<!doctype html>
<html>
<head><meta charset="utf-8"><style>
svg { font-family: var(--font-sans); }
.lbl { font-size: 12px; fill: hsl(var(--muted-foreground)); }
.hd { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
</style></head>
<body>
<svg viewBox="0 0 640 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- zona texto -->
  <rect x="16" y="24" width="300" height="330" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text class="lbl" x="26" y="44">área de texto (intocada)</text>
  <text class="hd" x="26" y="90">O lugar de</text>
  <text class="hd" x="26" y="112" fill="hsl(var(--accent))">quem constrói</text>
  <text class="hd" x="26" y="134">decisão com dados</text>
  <rect x="26" y="170" width="200" height="7" rx="3" fill="hsl(var(--border))"/>
  <rect x="26" y="184" width="230" height="7" rx="3" fill="hsl(var(--border))"/>
  <rect x="26" y="198" width="150" height="7" rx="3" fill="hsl(var(--border))"/>
  <rect x="26" y="228" width="120" height="34" rx="17" fill="hsl(var(--primary))"/>
  <text class="lbl" x="46" y="249" fill="hsl(var(--primary-foreground))">Quero participar</text>

  <!-- badge removido -->
  <rect x="160" y="228" width="130" height="34" rx="17" fill="none" stroke="hsl(var(--muted-foreground))" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="lbl" x="172" y="249" opacity="0.6">badge removido</text>

  <!-- colagem direita -->
  <g>
    <rect x="352" y="34" width="104" height="150" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" transform="rotate(-5 404 109)"/>
    <rect x="474" y="20" width="130" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" transform="rotate(4 539 68)"/>
    <rect x="470" y="140" width="96" height="96" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" transform="rotate(7 518 188)"/>
    <rect x="340" y="212" width="118" height="84" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))" transform="rotate(3 399 254)"/>
    <rect x="486" y="260" width="90" height="120" rx="8" fill="hsl(var(--accent))" fill-opacity="0.18" stroke="hsl(var(--accent))" transform="rotate(-6 531 320)"/>
  </g>
  <circle cx="606" cy="322" r="10" fill="hsl(var(--accent))"/>
  <text class="lbl" x="602" y="326" fill="hsl(var(--accent-foreground))">5</text>
  <text class="lbl" x="352" y="366">cinco recortes: tamanhos, alturas e ângulos variados</text>
</svg>
</body>
</html>
