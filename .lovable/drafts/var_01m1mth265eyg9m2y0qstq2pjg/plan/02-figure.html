<!doctype html>
<html>
<body style="margin:0">
<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;font-family:var(--font-sans)">
  <style>
    .lbl{font-size:14px;font-weight:480;fill:hsl(var(--foreground))}
    .sm{font-size:12px;fill:hsl(var(--muted-foreground))}
    .tag{font-size:12px;fill:hsl(var(--muted-foreground))}
    .bx{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
    .q{fill:hsl(var(--muted));stroke:none}
    .gk{fill:hsl(var(--border))}
  </style>

  <!-- 1 abertura -->
  <text class="tag" x="0" y="12">1 · abertura</text>
  <rect class="q" x="0" y="20" width="200" height="120" rx="8" transform="rotate(-2 100 80)"/>
  <rect class="gk" x="16" y="46" width="150" height="16" rx="4"/>
  <rect class="gk" x="16" y="70" width="120" height="16" rx="4"/>
  <rect class="bx" x="150" y="90" width="90" height="60" rx="8" transform="rotate(3 195 120)"/>
  <rect x="24" y="104" width="74" height="18" rx="9" fill="hsl(var(--accent))"/>
  <text x="34" y="117" style="font-size:11px;fill:hsl(var(--accent-foreground))">comunidade</text>

  <!-- 2 faixa escala -->
  <text class="tag" x="300" y="12">2 · prova de escala (faixa em movimento)</text>
  <rect class="q" x="300" y="20" width="340" height="46" rx="8"/>
  <rect class="gk" x="314" y="36" width="60" height="14" rx="4"/>
  <rect class="gk" x="386" y="36" width="78" height="14" rx="4"/>
  <rect class="gk" x="476" y="36" width="54" height="14" rx="4"/>
  <rect class="gk" x="542" y="36" width="70" height="14" rx="4"/>
  <path d="M300 78 H630" stroke="hsl(var(--muted-foreground))" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#c)"/>
  <text class="sm" x="300" y="96">setores reais, sem números</text>

  <!-- 3 mural -->
  <text class="tag" x="0" y="176">3 · mural de arquétipos (colagem densa)</text>
  <rect class="bx" x="0" y="186" width="110" height="88" rx="8" transform="rotate(-2 55 230)"/>
  <rect class="q" x="118" y="196" width="150" height="52" rx="8"/>
  <rect class="gk" x="130" y="214" width="110" height="14" rx="4"/>
  <rect class="bx" x="126" y="256" width="80" height="66" rx="8" transform="rotate(2 166 289)"/>
  <rect class="q" x="216" y="252" width="120" height="70" rx="8" transform="rotate(-1 276 287)"/>
  <rect class="bx" x="278" y="186" width="120" height="60" rx="8"/>
  <rect class="gk" x="292" y="208" width="86" height="14" rx="4"/>
  <rect class="q" x="346" y="256" width="94" height="60" rx="8" transform="rotate(2 393 286)"/>

  <!-- 4 eventos -->
  <text class="tag" x="440" y="176">4 · eventos</text>
  <rect class="gk" x="440" y="192" width="150" height="20" rx="5"/>
  <rect class="gk" x="466" y="226" width="120" height="16" rx="4"/>
  <rect class="gk" x="492" y="256" width="96" height="14" rx="4"/>
  <text class="sm" x="440" y="296">escalonado, pesos diferentes</text>

  <!-- 5 convite -->
  <text class="tag" x="0" y="352">5 · convite</text>
  <rect class="gk" x="0" y="362" width="250" height="18" rx="5"/>
  <rect class="gk" x="0" y="388" width="180" height="14" rx="4"/>

  <!-- 6 fechamento -->
  <text class="tag" x="300" y="352">6 · fechamento + formulário</text>
  <rect class="q" x="300" y="360" width="340" height="86" rx="8"/>
  <rect class="bx" x="314" y="374" width="150" height="58" rx="8"/>
  <rect x="480" y="396" width="120" height="22" rx="11" fill="none" stroke="hsl(var(--accent))"/>
  <text x="496" y="411" style="font-size:11px;fill:hsl(var(--foreground))">ContactForm</text>
  <path d="M300 456 H640" stroke="hsl(var(--border))"/>
  <text class="sm" x="300" y="468">emenda no rodapé</text>

  <defs>
    <marker id="c" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>
</svg>
</body>
</html>
