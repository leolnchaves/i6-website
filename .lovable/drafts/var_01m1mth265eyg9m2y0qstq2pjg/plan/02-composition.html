<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); color: hsl(var(--foreground));">
  <defs>

      .fill-graphite { fill: hsl(var(--card)); }
      .fill-accent { fill: hsl(var(--accent)); }
      .text { fill: hsl(var(--foreground)); font-size: 12px; font-weight: 500; }
      .text-small { fill: hsl(var(--muted-foreground)); font-size: 10px; }
      .wire { stroke: hsl(var(--border)); stroke-width: 1; fill: none; }
