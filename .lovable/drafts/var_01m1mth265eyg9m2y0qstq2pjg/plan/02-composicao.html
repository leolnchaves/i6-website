  <!-- antes -->

  <rect x="24" y="42" width="90" height="9" rx="4" class="gk"/>

  <rect x="24" y="88" width="230" height="7" rx="3" class="gk"/>

  <rect x="8" y="228" width="280" height="120" rx="8" class="zn"/>
  <rect x="24" y="244" width="60" height="26" rx="6" class="q"/>
  <rect x="24" y="276" width="60" height="26" rx="6" class="q"/>
  <rect x="96" y="244" width="176" height="88" rx="8" class="bx"/>
  <text x="130" y="292" class="sm">painel do produto</text>

  <!-- depois -->
  <text x="352" y="16" class="sm">depois — uma seção</text>
  <rect x="352" y="26" width="280" height="322" rx="8" style="fill:none;stroke:hsl(var(--accent));stroke-width:1;stroke-dasharray:4 3"/>
  <rect x="368" y="42" width="90" height="9" rx="4" class="gk"/>

  <rect x="368" y="118" width="70" height="38" rx="8" class="bx"/>

  <text x="14" y="424" style="fill:hsl(var(--accent-foreground));font-size:11px">2</text>

  <circle cx="18" cy="448" r="9" style="fill:hsl(var(--accent))"/>
  <text x="14" y="452" style="fill:hsl(var(--accent-foreground));font-size:11px">3</text>
