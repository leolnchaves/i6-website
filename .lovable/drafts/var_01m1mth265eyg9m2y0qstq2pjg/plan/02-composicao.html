<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Composição da seção i6 Builder">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tag { font-size: 12px; fill: hsl(var(--muted-foreground)); }
  </style>

  <!-- full-bleed dark band -->
  <rect x="0" y="8" width="640" height="384" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--border))"/>
  <text class="tag" x="12" y="28">faixa escura, largura total</text>

  <!-- opening -->
  <text class="sm" x="32" y="56">i6 BUILDER PLATFORM</text>
  <text class="lbl" x="32" y="78">Construa sobre a inteligência da infinity6</text>
  <rect x="32" y="88" width="300" height="6" rx="3" fill="hsl(var(--border))"/>
  <rect x="32" y="100" width="230" height="6" rx="3" fill="hsl(var(--border))"/>

  <!-- 4 pillars -->
  <g>
    <rect x="32" y="128" width="1" height="46" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="42" y="140" style="font-size:12px">Engines preditivos</text>
    <rect x="42" y="150" width="100" height="5" rx="2.5" fill="hsl(var(--border))"/>
    <rect x="42" y="160" width="76" height="5" rx="2.5" fill="hsl(var(--border))"/>

    <rect x="180" y="128" width="1" height="46" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="190" y="140" style="font-size:12px">SDKs e API</text>
    <rect x="190" y="150" width="100" height="5" rx="2.5" fill="hsl(var(--border))"/>
    <rect x="190" y="160" width="70" height="5" rx="2.5" fill="hsl(var(--border))"/>

    <rect x="328" y="128" width="1" height="46" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="338" y="140" style="font-size:12px">Toolkits de modelagem</text>
    <rect x="338" y="150" width="100" height="5" rx="2.5" fill="hsl(var(--border))"/>
    <rect x="338" y="160" width="82" height="5" rx="2.5" fill="hsl(var(--border))"/>

    <rect x="476" y="128" width="1" height="46" fill="hsl(var(--muted-foreground))"/>
    <text class="lbl" x="486" y="140" style="font-size:12px">Governança</text>
    <rect x="486" y="150" width="100" height="5" rx="2.5" fill="hsl(var(--border))"/>
    <rect x="486" y="160" width="66" height="5" rx="2.5" fill="hsl(var(--border))"/>
  </g>

  <!-- split band -->
  <rect x="0" y="196" width="320" height="132" fill="hsl(var(--accent))"/>
  <rect x="320" y="196" width="320" height="132" fill="hsl(var(--secondary))"/>
  <line x1="320" y1="196" x2="320" y2="328" stroke="hsl(var(--border))"/>
  <line x1="0" y1="196" x2="640" y2="196" stroke="hsl(var(--border))"/>
  <line x1="0" y1="328" x2="640" y2="328" stroke="hsl(var(--border))"/>

  <text x="32" y="222" style="font-size:12px; fill:hsl(var(--accent-foreground))">01</text>
  <text x="32" y="244" class="lbl" style="fill:hsl(var(--accent-foreground))">Embedded (OEM)</text>
  <rect x="32" y="256" width="230" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>
  <rect x="32" y="276" width="150" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>
  <rect x="32" y="292" width="170" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>
  <rect x="32" y="308" width="140" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>

  <text x="352" y="222" style="font-size:12px; fill:hsl(var(--secondary-foreground))">02</text>
  <text x="352" y="244" class="lbl" style="fill:hsl(var(--secondary-foreground))">Novo Produto</text>
  <rect x="352" y="256" width="230" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>
  <rect x="352" y="276" width="150" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>
  <rect x="352" y="292" width="170" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>
  <rect x="352" y="308" width="140" height="5" rx="2.5" fill="hsl(var(--muted-foreground))" opacity="0.5"/>

  <!-- CTAs left aligned -->
  <rect x="32" y="350" width="170" height="30" rx="15" fill="hsl(var(--primary))"/>
  <text x="52" y="369" style="font-size:12px; fill:hsl(var(--primary-foreground))">Construir com o i6 Builder</text>
  <rect x="214" y="350" width="150" height="30" rx="15" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text x="234" y="369" style="font-size:12px">Falar com especialista</text>
</svg>
