<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width:100%; height:auto">
  <style>
    .lbl { font-size:12px; fill: hsl(var(--muted-foreground)); }
    .box { fill:none; stroke: hsl(var(--muted-foreground)); stroke-width:1; }
    .bar { fill: hsl(var(--border)); }
    .quiet { fill: hsl(var(--muted)); }
    .big { font-size:38px; font-weight:700; fill: hsl(var(--accent)); }
    .ttl { font-size:14px; font-weight:480; fill: hsl(var(--foreground)); }
    .tag { font-size:11px; fill: hsl(var(--muted-foreground)); }
    .note { font-size:12px; fill: hsl(var(--muted-foreground)); }
    .pin { fill: hsl(var(--accent)); }
    .pinl { font-size:11px; font-weight:600; fill: hsl(var(--accent-foreground)); }
  </style>

  <!-- hoje -->
  <text class="lbl" x="8" y="16">hoje</text>
  <rect class="box" x="8" y="26" width="180" height="250" rx="8"/>
  <rect class="quiet" x="24" y="42" width="148" height="56" rx="6"/>
  <text class="tag" x="24" y="118">INDÚSTRIA</text>
  <text class="ttl" x="24" y="140">Título do case</text>
  <rect class="bar" x="24" y="152" width="148" height="6" rx="3"/>
  <rect class="bar" x="24" y="164" width="112" height="6" rx="3"/>
  <rect class="box" x="24" y="186" width="70" height="52" rx="8"/>
  <text x="59" y="212" text-anchor="middle" style="font-size:14px; font-weight:600; fill: hsl(var(--muted-foreground))">+23%</text>
  <rect class="box" x="102" y="186" width="70" height="52" rx="8"/>
  <text x="137" y="212" text-anchor="middle" style="font-size:14px; font-weight:600; fill: hsl(var(--muted-foreground))">+36%</text>
  <rect class="bar" x="24" y="254" width="40" height="8" rx="4"/>

  <!-- seta -->
  <line x1="204" y1="150" x2="244" y2="150" stroke="hsl(var(--muted-foreground))" stroke-width="1" marker-end="url(#c)"/>
  <defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="hsl(var(--muted-foreground))"/></marker></defs>

  <!-- proposto -->
  <text class="lbl" x="262" y="16">proposto — o resultado é o cartão</text>
  <rect class="box" x="262" y="26" width="250" height="250" rx="8"/>
  <text class="tag" x="282" y="52">INDÚSTRIA</text>
  <text class="big" x="282" y="104">+23%</text>
  <text class="note" x="282" y="124">de ticket médio por PDV</text>
  <line x1="282" y1="140" x2="492" y2="140" stroke="hsl(var(--border))"/>
  <text class="ttl" x="282" y="162">Título do case em duas linhas</text>
  <rect class="bar" x="282" y="174" width="210" height="6" rx="3"/>
  <rect class="bar" x="282" y="186" width="160" height="6" rx="3"/>
  <rect class="quiet" x="282" y="204" width="210" height="34" rx="6"/>
  <text class="note" x="287" y="226">faixa de imagem discreta</text>
  <rect class="bar" x="282" y="252" width="40" height="8" rx="4"/>
  <text class="note" x="452" y="260">ler →</text>

  <circle class="pin" cx="540" cy="88" r="9"/><text class="pinl" x="540" y="92" text-anchor="middle">1</text>
  <text class="note" x="556" y="92">métrica 1 domina</text>
  <circle class="pin" cx="540" cy="164" r="9"/><text class="pinl" x="540" y="168" text-anchor="middle">2</text>
  <text class="note" x="556" y="168">título dá contexto</text>
  <circle class="pin" cx="540" cy="220" r="9"/><text class="pinl" x="540" y="224" text-anchor="middle">3</text>
  <text class="note" x="556" y="224">imagem + logo apoiam</text>
</svg>
