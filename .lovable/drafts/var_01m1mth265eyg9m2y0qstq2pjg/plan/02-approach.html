<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans);">
  <defs>
    <style>
      text { font-family: var(--font-mono); }
      .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
      .fill { fill: hsl(var(--muted)); }
      .accent { fill: hsl(var(--primary)); }
      .fg { fill: hsl(var(--foreground)); }
      .muted { fill: hsl(var(--muted-foreground)); }
      .cursor { fill: hsl(var(--primary)); }
    </style>
  </defs>

  <!-- background surface -->
  <rect x="20" y="20" width="600" height="440" class="box fill" rx="12" />

  <!-- window chrome -->
  <rect x="40" y="40" width="560" height="32" rx="6" fill="hsl(var(--card))" stroke="hsl(var(--border))" />
  <circle cx="58" cy="56" r="5" class="accent" />
  <circle cx="78" cy="56" r="5" class="muted" />
  <circle cx="98" cy="56" r="5" class="muted" />
  <text x="470" y="61" font-size="11" class="muted" text-anchor="end">forecast.py</text>

  <!-- code block -->
  <rect x="40" y="80" width="560" height="360" class="box" fill="hsl(var(--card-foreground) / 0.06)" />

  <!-- line numbers -->
  <text x="60" y="115" font-size="12" class="muted">1</text>
  <text x="60" y="145" font-size="12" class="muted">2</text>
  <text x="60" y="175" font-size="12" class="muted">3</text>
  <text x="60" y="205" font-size="12" class="muted">4</text>
  <text x="60" y="235" font-size="12" class="muted">5</text>
  <text x="60" y="265" font-size="12" class="muted">6</text>

  <!-- typed code -->
  <text x="85" y="115" font-size="13" class="fg">from i6 import Builder</text>
  <text x="85" y="145" font-size="13" class="fg">builder = Builder(api_key=I6_KEY)</text>
  <text x="85" y="175" font-size="13" class="fg">forecast = builder.forecast(</text>
  <text x="105" y="205" font-size="13" class="fg">series="demanda_sku",</text>
  <text x="105" y="235" font-size="13" class="fg">horizon=12,</text>
  <text x="85" y="265" font-size="13" class="fg">)</text>

  <!-- blinking cursor -->
  <rect x="100" y="285" width="8" height="18" class="cursor" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- annotation -->
  <text x="320" y="380" font-size="12" class="muted" text-anchor="middle">Animação typewriter caractere a caractere + cursor piscando</text>
</svg>
