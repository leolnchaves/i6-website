<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    text{fill:hsl(var(--muted-foreground));font-size:12px;font-family:var(--font-sans)}
    .lbl{fill:hsl(var(--foreground));font-size:14px;font-weight:480}
    .bar{fill:hsl(var(--border))}
    .rail{stroke:hsl(var(--border));stroke-width:1}
  </style>

  <rect x="8" y="8" width="624" height="24" fill="hsl(var(--muted))" rx="8"/>
  <text x="22" y="24">header</text>

  <!-- faixa superior -->
  <rect x="24" y="50" width="132" height="16" fill="none" stroke="hsl(var(--muted-foreground))" rx="3"/>
  <text x="32" y="62" font-size="9">AI DECISION INTELLIGENCE</text>
  <text x="300" y="62" font-size="9">MOTORES · MODELO FUNDACIONAL · XAI</text>

  <!-- titulo dominante -->
  <text x="24" y="106" class="lbl" font-size="18">A plataforma de</text>
  <text x="24" y="132" class="lbl" font-size="18" fill="hsl(var(--accent))">decisão preditiva</text>
  <text x="24" y="158" class="lbl" font-size="18">mais avançada da</text>
  <text x="24" y="184" class="lbl" font-size="18">América Latina</text>
  <rect x="24" y="200" width="250" height="7" class="bar" rx="4"/>
  <rect x="24" y="214" width="210" height="7" class="bar" rx="4"/>

  <!-- pilha de decisões em degrau, invadindo a coluna do titulo -->
  <g>
    <rect x="352" y="96" width="256" height="52" fill="hsl(var(--card))" stroke="hsl(var(--border))" rx="6"/>
    <rect x="352" y="96" width="3" height="52" fill="hsl(var(--accent))"/>
    <text x="366" y="114" font-size="9">DISCOVERY</text>
    <text x="366" y="132" font-size="11" fill="hsl(var(--accent))">+4,1 p.p. de margem no ticket</text>

    <rect x="376" y="158" width="256" height="52" fill="hsl(var(--card))" stroke="hsl(var(--border))" rx="6"/>
    <rect x="376" y="158" width="3" height="52" fill="hsl(var(--accent))"/>
    <text x="390" y="176" font-size="9">ESPARSIDADE</text>
    <text x="390" y="194" font-size="11" fill="hsl(var(--accent))">+18% de cobertura</text>

    <rect x="364" y="220" width="256" height="52" fill="hsl(var(--card))" stroke="hsl(var(--border))" rx="6"/>
    <rect x="364" y="220" width="3" height="52" fill="hsl(var(--accent))"/>
    <text x="378" y="238" font-size="9">METAS</text>
    <text x="378" y="256" font-size="11" fill="hsl(var(--accent))">+9% de atingimento</text>
  </g>

  <!-- camada inferior: frentes nas margens + logos no centro -->
  <line x1="24" y1="318" x2="176" y2="318" class="rail"/>
  <text x="24" y="336" font-size="9">I6 DECISION SUITE</text>
  <text x="24" y="354" class="lbl">Pronta para decidir</text>
  <text x="24" y="374" fill="hsl(var(--accent))">Saiba mais ↓</text>

  <line x1="464" y1="318" x2="616" y2="318" class="rail"/>
  <text x="616" y="336" font-size="9" text-anchor="end">I6 BUILDER PLATFORM</text>
  <text x="616" y="354" class="lbl" text-anchor="end">Diferenciar e escalar</text>
  <text x="616" y="374" fill="hsl(var(--accent))" text-anchor="end">Saiba mais ↓</text>

  <text x="320" y="336" font-size="9" text-anchor="middle">LÍDERES QUE TRANSFORMAM ANTECIPAÇÃO EM VANTAGEM</text>
  <rect x="212" y="352" width="46" height="11" class="bar" rx="5"/>
  <rect x="268" y="352" width="46" height="11" class="bar" rx="5"/>
  <rect x="324" y="352" width="46" height="11" class="bar" rx="5"/>
  <rect x="380" y="352" width="46" height="11" class="bar" rx="5"/>
</svg>
