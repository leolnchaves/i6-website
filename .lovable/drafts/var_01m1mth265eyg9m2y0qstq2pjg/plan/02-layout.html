<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>.lbl{font-size:12px;fill:hsl(var(--muted-foreground));}</style>
  <rect x="8" y="8" width="624" height="314" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text x="20" y="28" class="lbl">abertura — peças maiores, três faixas no lado direito</text>

  <!-- text zone untouched -->
  <rect x="28" y="60" width="250" height="20" rx="8" fill="hsl(var(--muted))"/>
  <rect x="28" y="88" width="285" height="28" rx="8" fill="hsl(var(--muted))"/>
  <rect x="28" y="124" width="235" height="28" rx="8" fill="hsl(var(--muted))"/>
  <rect x="28" y="172" width="190" height="9" rx="4" fill="hsl(var(--border))"/>
  <rect x="28" y="188" width="150" height="9" rx="4" fill="hsl(var(--border))"/>
  <rect x="28" y="216" width="112" height="26" rx="13" fill="hsl(var(--primary))"/>
  <text x="28" y="272" class="lbl">texto e botão inalterados</text>

  <!-- band rails -->
  <g stroke="hsl(var(--border))">
    <line x1="330" y1="46" x2="616" y2="46"/>
    <line x1="330" y1="146" x2="616" y2="146"/>
    <line x1="330" y1="238" x2="616" y2="238"/>
  </g>

  <!-- photos bigger -->
  <g stroke="hsl(var(--muted-foreground))" fill="hsl(var(--muted))" stroke-width="1">
    <rect x="500" y="52" width="104" height="150" rx="8" transform="rotate(-5 552 127)"/>
    <rect x="356" y="54" width="120" height="76" rx="8" transform="rotate(4 416 92)"/>
    <rect x="352" y="238" width="86" height="72" rx="8" transform="rotate(-6 395 274)"/>
    <rect x="470" y="246" width="118" height="70" rx="8" transform="rotate(3 529 281)"/>
    <rect x="416" y="150" width="84" height="84" rx="8" transform="rotate(7 458 192)"/>
  </g>

  <!-- code cards bigger -->
  <g>
    <g transform="rotate(-4 386 176)">
      <rect x="322" y="150" width="128" height="56" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent-foreground))"/>
      <circle cx="332" cy="160" r="2.5" fill="hsl(var(--accent-foreground))"/>
      <rect x="330" y="172" width="86" height="4" rx="2" fill="hsl(var(--accent-foreground))" opacity="0.5"/>
      <rect x="330" y="184" width="66" height="4" rx="2" fill="hsl(var(--accent-foreground))" opacity="0.35"/>
    </g>
    <g transform="rotate(5 552 216)">
      <rect x="496" y="196" width="112" height="44" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent-foreground))"/>
      <rect x="504" y="214" width="72" height="4" rx="2" fill="hsl(var(--accent-foreground))" opacity="0.5"/>
      <rect x="504" y="226" width="50" height="4" rx="2" fill="hsl(var(--accent-foreground))" opacity="0.35"/>
    </g>
    <g transform="rotate(-6 420 62)">
      <rect x="360" y="40" width="120" height="20" rx="6" fill="none" stroke="hsl(var(--muted-foreground))" stroke-dasharray="3 3"/>
    </g>
  </g>

  <circle cx="352" cy="300" r="9" fill="hsl(var(--accent))"/>
  <text x="348" y="304" style="font-size:11px" fill="hsl(var(--accent-foreground))">1</text>
  <text x="370" y="304" class="lbl">1 — foto e código alternando nas três faixas</text>
</svg>
