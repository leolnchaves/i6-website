<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <!-- opening -->
  <rect x="24" y="16" width="380" height="66" rx="8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <text x="214" y="42" text-anchor="middle" font-size="14" font-weight="480" fill="hsl(var(--foreground))">Título + descrição</text>
  <text x="214" y="62" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">largos, sozinhos na abertura</text>

  <line x1="24" y1="96" x2="616" y2="96" stroke="hsl(var(--border))" stroke-width="1"/>

    <circle cx="240" cy="110" r="3" fill="hsl(var(--primary))"/>
    <text x="250" y="114">02 Inteligência</text>
    <circle cx="430" cy="110" r="3" fill="hsl(var(--primary))"/>
    <text x="440" y="114">03 Execução</text>
  </g>
  <line x1="24" y1="124" x2="616" y2="124" stroke="hsl(var(--border))" stroke-width="1"/>

  <!-- explorer -->
  <rect x="24" y="140" width="170" height="196" rx="8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <text x="109" y="160" text-anchor="middle" font-size="12" font-weight="480" fill="hsl(var(--foreground))">PRODUTOS + título</text>
  <g fill="none" stroke="hsl(var(--border))" stroke-width="1">
    <rect x="34" y="170" width="150" height="26" rx="6"/>

  <rect x="34" y="170" width="150" height="26" rx="6" fill="none" stroke="hsl(var(--primary))" stroke-width="1"/>
  <text x="109" y="187" text-anchor="middle" font-size="10" fill="hsl(var(--muted-foreground))">nome + 1 linha</text>

  <rect x="206" y="140" width="410" height="196" rx="8" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <text x="222" y="162" font-size="14" font-weight="480" fill="hsl(var(--foreground))">Painel do produto ativo</text>
  <text x="222" y="180" font-size="12" fill="hsl(var(--muted-foreground))">headline + corpo · dor em cartão lateral</text>
  <text x="222" y="200" font-size="12" fill="hsl(var(--muted-foreground))">capacidades em marcadores</text>
  <g>
    <rect x="222" y="290" width="116" height="34" rx="6" fill="hsl(var(--muted))"/>
    <rect x="352" y="290" width="116" height="34" rx="6" fill="hsl(var(--muted))"/>
    <rect x="482" y="290" width="116" height="34" rx="6" fill="hsl(var(--muted))"/>
    <text x="280" y="310" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">Entrada</text>
    <text x="410" y="310" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">Decisão</text>
    <text x="540" y="310" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">Valor</text>
    <path d="M342 307 h6" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    <path d="M472 307 h6" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>

  <rect x="200" y="352" width="150" height="28" rx="14" fill="none" stroke="hsl(var(--primary))" stroke-width="1"/>
  <text x="275" y="370" text-anchor="middle" font-size="12" fill="hsl(var(--primary))">Conhecer a suíte ↗</text>
  <rect x="362" y="352" width="130" height="28" rx="14" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
  <text x="427" y="370" text-anchor="middle" font-size="12" fill="hsl(var(--foreground))">Falar com especialista</text>

  <!-- pin -->
  <circle cx="616" cy="110" r="8" fill="hsl(var(--accent))"/>
  <text x="616" y="114" text-anchor="middle" font-size="10" fill="hsl(var(--accent-foreground))">1</text>
  <text x="320" y="395" text-anchor="middle" font-size="12" fill="hsl(var(--muted-foreground))">Pilares subordinados entre abertura e explorador; tudo visível em ~900px sem scroll</text>
