<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans);">
  <style>
    text { font-family: var(--font-sans); }
    .label { font-size: 14px; font-weight: 600; fill: hsl(var(--foreground)); }
    .hint { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .field { fill: hsl(var(--card)); stroke: hsl(var(--border)); }
  </style>

  <!-- Before -->
  <rect x="20" y="20" width="290" height="200" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text x="35" y="45" class="label">Antes</text>
  <text x="35" y="70" class="label">Mensagem *</text>
  <rect x="35" y="80" width="260" height="120" rx="6" class="field"/>
  <text x="45" y="100" class="hint">Conte um pouco do seu histórico, por que você quer...</text>
  <text x="45" y="125" class="hint" style="fill: hsl(var(--muted-foreground)); opacity: .5;">Texto some ao digitar</text>

  <!-- After -->
  <rect x="330" y="20" width="290" height="200" rx="8" fill="none" stroke="hsl(var(--border))"/>
  <text x="345" y="45" class="label">Depois</text>
  <text x="345" y="70" class="label">Mensagem *</text>
  <text x="345" y="90" class="hint">Conte um pouco do seu histórico, por que você quer</text>
  <text x="345" y="108" class="hint">fazer parte da comunidade e o que espera encontrar aqui.</text>
  <rect x="345" y="120" width="260" height="80" rx="6" class="field"/>
  <text x="355" y="145" class="hint" style="fill: hsl(var(--muted-foreground)); opacity: .5;">Campo vazio ou com placeholder curto</text>
</svg>
